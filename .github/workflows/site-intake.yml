name: Daily Site Publication

on:
  workflow_dispatch:
  schedule:
    # 12:17 по Екатеринбургу; GitHub может начать запланированный запуск позже.
    - cron: "17 7 * * *"

# Публикация сайта меняет только собственные карточки и границу чтения истории.
# Telegram secrets этому workflow не передаются.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-daily-publication
  cancel-in-progress: false

jobs:
  publish-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish one site card
        working-directory: site
        run: >-
          python3 -m generator.import_published
          --limit 1
          --scan-limit 25
          --multiple-homicide-only
          --max-age-days 7
          --current-event-only
          --publish

      - name: Save and publish site card
        shell: bash
        run: |
          if git diff --quiet -- site/data/generator-state.json site/src/content/events; then
            echo "Site publication did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/generator-state.json site/src/content/events
          git commit -m "Publish daily site card"

          # Автопостер мог обновить историю, пока создавалась карточка.
          # Переносим только служебный коммит сайта поверх свежей main.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Site publication push race on attempt ${attempt}; retrying."
          done

          echo "Failed to persist site publication after 3 attempts."
          exit 1

  build-site:
    needs: publish-card
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest repository state
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Test independent site intake
        run: python3 -m unittest discover -s site/tests -t site -v

      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          path: site
          node-version: 24
        env:
          SITE_URL: "https://teadrunkerhard777.github.io"
          BASE_PATH: "/LiveCrime"

  deploy-site:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
